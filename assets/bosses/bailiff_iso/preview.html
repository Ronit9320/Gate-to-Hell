<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ash Bailiff · isometric animation preview</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0a1216;color:#e8dcc5;font:15px system-ui;display:grid;place-items:center}main{width:min(960px,96vw);padding:28px}h1{font-family:Georgia,serif;font-size:38px;font-weight:400;margin:8px 0}p{color:#a8b7b6;line-height:1.5}.tag{color:#e7a45a;letter-spacing:3px;font-size:12px}section{display:grid;grid-template-columns:1fr 240px;gap:24px;margin-top:24px}canvas{width:100%;background:radial-gradient(#223334,#111b21);border:1px solid #394845;border-radius:14px}label{display:block;margin:18px 0 8px;color:#b4c5bb}select,button,input{width:100%;background:#243634;color:#eee0c3;border:1px solid #506057;border-radius:6px;padding:10px}button{margin-top:20px;cursor:pointer}small{display:block;margin-top:24px;color:#879b99;line-height:1.6}@media(max-width:650px){section{grid-template-columns:1fr}}</style>
<main><div class="tag">BLENDER → GAME SPRITES</div><h1>The Ash Bailiff</h1><p>Menacing executioner revision: blackened death mask, detailed armor, a closed hammer grip and a new wrist-controlled swing. Eight directions and five animations.</p><section><canvas id="view" width="640" height="540"></canvas><aside><label for="direction">Facing direction</label><select id="direction"></select><label for="animation">Animation</label><select id="animation"></select><label for="speed">Playback speed</label><input id="speed" type="range" min="0.25" max="2" value="1" step="0.25"><button id="replay">Replay</button><button id="pause">Pause</button><small id="info">Loading atlases…</small></aside></section></main>
<script>
const meta={width:256,height:256,columns:8,anchorX:128,anchorY:204,animations:{idle:{offset:0,frames:8,fps:12,loop:true},attack:{offset:8,frames:10,fps:12},walk:{offset:18,frames:8,fps:12,loop:true},hurt:{offset:26,frames:4,fps:12},death:{offset:30,frames:10,fps:10}}};
const names=['Southwest','South','Southeast','East','Northeast','North','Northwest','West'];
const dir=document.querySelector('#direction'),anim=document.querySelector('#animation'),ctx=document.querySelector('canvas').getContext('2d'),info=document.querySelector('#info');
names.forEach((n,i)=>dir.add(new Option(n,i)));Object.keys(meta.animations).forEach(n=>anim.add(new Option(n,n)));
let images=[],elapsed=0,last=performance.now(),paused=false;
for(let i=0;i<8;i++){const im=new Image();im.src='bailiff_y'+String(i*45).padStart(3,'0')+'.png';images.push(im);im.onerror=()=>info.textContent='Missing sheet. Finish rendering all eight directions.';}
dir.onchange=anim.onchange=()=>{elapsed=0};document.querySelector('#replay').onclick=()=>{elapsed=0;paused=false;document.querySelector('#pause').textContent='Pause'};document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume':'Pause'};
function draw(t){if(!paused)elapsed+=(t-last)/1000*Number(document.querySelector('#speed').value);last=t;ctx.clearRect(0,0,640,540);
ctx.strokeStyle='#324b47';ctx.lineWidth=1;for(let i=-5;i<=5;i++){ctx.beginPath();ctx.moveTo(320+i*44-200,355-100);ctx.lineTo(320+i*44+200,355+100);ctx.stroke();ctx.beginPath();ctx.moveTo(320-i*44-200,355+100);ctx.lineTo(320-i*44+200,355-100);ctx.stroke();}
ctx.fillStyle='#050c1099';ctx.beginPath();ctx.ellipse(320,355,72,27,0,0,Math.PI*2);ctx.fill();
const a=meta.animations[anim.value],f=a.loop?Math.floor(elapsed*a.fps)%a.frames:Math.min(a.frames-1,Math.floor(elapsed*a.fps)),cell=a.offset+f,im=images[Number(dir.value)],scale=1.45;
if(im.complete&&im.naturalWidth){ctx.drawImage(im,(cell%8)*256,Math.floor(cell/8)*256,256,256,320-meta.anchorX*scale,355-meta.anchorY*scale,256*scale,256*scale);info.textContent=`${names[Number(dir.value)]} · ${anim.value} · frame ${f+1}/${a.frames}\n256 × 256 RGBA · ${a.fps} fps`;}requestAnimationFrame(draw);}
requestAnimationFrame(draw);
const fx=document.createElement('section');fx.innerHTML='<div><p>Flame lanes / beams</p><canvas id="flames" width="512" height="256"></canvas></div><div><p>Molten slam</p><canvas id="slamfx" width="256" height="256"></canvas></div>';document.querySelector('main').appendChild(fx);
const effectViews=[['flames','bailiff_flame'],['slamfx','bailiff_slam']].map(([canvas,id])=>{const im=new Image();im.src='../../effects/combat/'+id+'.png';return {canvas:document.getElementById(canvas),im};});
function effects(t){const f=paused?3:Math.floor(t/100)%8;effectViews.forEach(({canvas,im})=>{const c=canvas.getContext('2d');c.clearRect(0,0,canvas.width,canvas.height);if(im.complete&&im.naturalWidth)c.drawImage(im,(f%4)*128,Math.floor(f/4)*128,128,128,(canvas.width-256)/2,0,256,256);});requestAnimationFrame(effects);}requestAnimationFrame(effects);
const review=document.createElement('p');review.innerHTML='<a style="color:#e7a45a" href="../../../art-src/previews/bailiff-menacing-grip.png">Grip close-up</a> · <a style="color:#e7a45a" href="../../../art-src/previews/bailiff-menacing-comparison.png">Before / after comparison</a>';document.querySelector('main').appendChild(review);
</script></html>
