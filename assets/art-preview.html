<!doctype html><meta charset="utf-8"><title>House of Cinders · Blender art library</title><style>body{background:#152127;color:#dde8e4;font:16px system-ui;margin:32px}select,button{font:inherit;padding:8px;background:#23363c;color:#eee;border:1px solid #688}canvas{background:#1b2b32;border:1px solid #3e5a5c}#effects{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}h1{color:#e5bd71}label{margin:12px}article{background:#1d3035;padding:12px}p{color:#a9bebb}#boss{width:384px;height:384px}</style><h1>House of Cinders · original Blender art</h1><p>23 boss appearances · eight directions · six poses · 91 dedicated effects · ten scenery props · four illustrations. No external services or libraries.</p><label>Boss <select id="appearance"></select></label><label>Direction <select id="direction"></select></label><label>Pose <select id="pose"></select></label><button id="pause">Pause</button><label><input id="still" type="checkbox">Reduced motion</label><p id="status"></p><canvas id="boss" width="384" height="384"></canvas><h2>Combat effects</h2><div id="effects"></div><h2>Scenery and illustrations</h2><div id="scenery"></div><script>const appearances=["bailiff_hell", "undertow", "kite", "bedrock", "bramble", "regent", "static", "sun", "kings", "throne", "undertow_hell", "kite_hell", "bedrock_hell", "bramble_hell", "regent_hell", "static_hell", "sun_hell", "kings_hell", "throne_hell", "throne_phase2", "throne_phase3", "throne_hell_phase2", "throne_hell_phase3"];const effectNames=["slash", "projectile", "muzzle", "trail", "hit", "critical", "hurt", "shield_create", "shield_absorb", "shield_break", "slam", "dust", "dot", "dodge", "switch_out", "switch_in", "reload_start", "reload_complete", "phase", "stagger", "recovery", "defeat", "heal", "cooldown", "skill_jack", "skill_match", "skill_penny", "skill_dealer", "skill_gale", "skill_zephyr", "skill_flint", "skill_mason", "skill_clover", "skill_briar", "skill_frost", "skill_whiteout", "skill_volt", "skill_count", "skill_crown", "skill_oracle", "skill_null", "skill_laugh", "reaction_steam_burst", "reaction_thaw", "reaction_frostbind", "reaction_live_wire", "reaction_flashover", "reaction_kindling", "reaction_bloom", "reaction_overgrowth", "reaction_crosswind", "reaction_gilded_guard", "reaction_collapse", "reaction_annihilation", "reaction_event_horizon", "aura_pyro", "aura_hydro", "aura_anemo", "aura_geo", "aura_dendro", "aura_cryo", "aura_electro", "aura_gravity", "aura_antimatter", "status_burn", "status_electric", "status_vulnerable", "status_shield", "status_stagger", "status_bloom", "hazard_flame", "hazard_water", "hazard_wind", "hazard_pillar", "hazard_rock", "hazard_bramble", "hazard_ignition", "hazard_ice", "hazard_shatter", "hazard_grid", "hazard_strike", "hazard_spiral", "hazard_pull", "hazard_push", "hazard_mass", "hazard_void", "hazard_wave_void", "hazard_zone", "consume_flask", "consume_aegis", "consume_wind"];const clips={idle:[0,8,12,true],attack:[8,10,12,false],hurt:[18,4,12,false],death:[22,10,10,false],stagger:[32,4,8,true],recovery:[36,4,12,false]};let paused=false,time=0,last=0;const cache={},fx=[];const appearance=document.querySelector('#appearance'),direction=document.querySelector('#direction'),pose=document.querySelector('#pose'),boss=document.querySelector('#boss'),still=document.querySelector('#still');for(const name of appearances)appearance.add(new Option(name.replaceAll('_',' '),name));for(let i=0;i<8;i++)direction.add(new Option(i*45+'°',i*45));for(const name of Object.keys(clips))pose.add(new Option(name,name));function load(){const path='bosses/isometric/'+appearance.value+'/boss_y'+direction.value.padStart(3,'0')+'.png';if(!cache[path]){cache[path]=new Image();cache[path].src=path;}document.querySelector('#status').textContent=appearance.value+' · ground anchor (96,146) · 192px cells · 8×5 · '+pose.value;return cache[path];}for(const name of effectNames){const a=document.createElement('article');a.innerHTML='<strong>'+name.replaceAll('_',' ')+'</strong><br><canvas width="192" height="192"></canvas>';document.querySelector('#effects').append(a);const img=new Image();img.src='effects/combat/'+name+'.png';fx.push({img,c:a.querySelector('canvas')});}const props=['prop_bailiff','prop_undertow','prop_kite','prop_bedrock','prop_bramble','prop_regent','prop_static','prop_sun','prop_kings','prop_throne','reward','victory','defeat','hell_entry'];for(const name of props){const img=new Image();img.src='scenery/'+name+'.png';img.width=160;img.alt=name;document.querySelector('#scenery').append(img);}document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Play':'Pause';};for(const e of [appearance,direction,pose])e.onchange=()=>{time=0;load();};function draw(ts){if(last&&!paused&&!still.checked)time+=(ts-last)/1000;last=ts;const img=load(),[start,count,fps,loop]=clips[pose.value];let f=still.checked?(pose.value==='death'?count-1:0):Math.floor(time*fps);f=loop?f%count:Math.min(f,count-1);const ctx=boss.getContext('2d');ctx.clearRect(0,0,384,384);if(img.complete&&img.naturalWidth)ctx.drawImage(img,(start+f)%8*192,Math.floor((start+f)/8)*192,192,192,0,0,384,384);for(const {img,c} of fx){const ctx=c.getContext('2d'),f=still.checked?3:Math.floor(time*12)%8;ctx.clearRect(0,0,192,192);if(img.complete&&img.naturalWidth)ctx.drawImage(img,f%4*128,Math.floor(f/4)*128,128,128,0,0,192,192);}requestAnimationFrame(draw);}requestAnimationFrame(draw);</script>
