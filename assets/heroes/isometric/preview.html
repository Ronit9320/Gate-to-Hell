<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>House of Cinders · Isometric heroes</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b171b;color:#efddb4;font:15px system-ui,sans-serif}main{max-width:1160px;margin:auto;padding:30px}h1{font-size:32px;margin-bottom:8px}p{color:#9ab6ac;line-height:1.6}h2{font-size:22px;font-weight:500}button,select,input{background:#17312e;border:1px solid #9c783d;color:#edddb9;padding:9px 12px}button,select{cursor:pointer}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.stage{margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:20px;border:1px solid #5a633f;background:#142528;padding:20px;text-align:center}.stage img{width:240px;height:288px;object-fit:contain}.stage canvas{width:240px;height:288px;image-rendering:auto}.gallery{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.tile{border:1px solid #475343;background:#102023;padding:12px;cursor:pointer;text-align:center}.tile img{width:100%;height:144px;object-fit:contain}.tile small{color:#94b1a5;display:block;margin-top:8px}.tile:hover{border-color:#d2a255}a{color:#dcb66e}@media(max-width:700px){.gallery{grid-template-columns:repeat(3,1fr)}.stage{grid-template-columns:1fr}.controls{gap:6px}}label{color:#a9bdab}footer{margin-top:30px}
</style>
<main>
<h1>HOUSE OF CINDERS · HEROES</h1>
<p>18 original 2D references reinterpreted as articulated Blender models.<br>Eight isometric directions · seven animations · 6,048 rendered frames.</p>
<div class="controls"><label>Hero <select id="hero"></select></label><label>Animation <select id="pose"></select></label><label>Facing <select id="direction"></select></label><button id="play">Pause</button><label>Frame <input id="frame" type="range" min="0" max="5" value="0" aria-label="Animation frame"></label></div>
<div class="stage"><div><h2>2D inspiration</h2><img id="reference" alt="Original hero reference"></div><div><h2>Blender isometric animation</h2><canvas id="sprite" width="320" height="384" aria-label="Isometric hero animation"></canvas></div></div>
<p id="caption"></p>
<h2>The full roster</h2><div id="gallery" class="gallery"></div>
<footer><p><a href="../../../art-src/blender/heroes-isometric.blend">Editable Blender library</a> · <a href="README.md">Rendering and integration notes</a></p></footer>
</main>
<script>
const roster=[['jack','Cinder Jack','Pyro'],['match','Madame Match','Pyro'],['penny','Penny Rill','Hydro'],['dealer','The Blue Dealer','Hydro'],['gale','Gale Knave','Anemo'],['zephyr','Zephyr Belle','Anemo'],['flint','Flint Rook','Geo'],['mason','The Gilt Mason','Geo'],['clover','Clover Hex','Dendro'],['briar','Briar Duchess','Dendro'],['frost','Frost Jester','Cryo'],['whiteout','Lady Whiteout','Cryo'],['volt','Volt Page','Electro'],['count','The Copper Count','Electro'],['crown','The Heavy Crown','Gravity'],['oracle','Orbit Oracle','Gravity'],['null','Null Harlequin','Antimatter'],['laugh','The Last Laugh','Antimatter']];
const poses={idle:[0,10,true],walk:[6,12,true],attack:[12,18,false],skill:[18,12,false],dodge:[24,24,false],hurt:[30,20,false],death:[36,8,false]};
const dirs=['Southwest','South','Southeast','East','Northeast','North','Northwest','West'];
const hero=document.querySelector('#hero'),pose=document.querySelector('#pose'),direction=document.querySelector('#direction'),frame=document.querySelector('#frame'),button=document.querySelector('#play'),canvas=document.querySelector('#sprite'),ctx=canvas.getContext('2d');
const cache={};let playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,time=0,last=performance.now();
for(const [id,name,element]of roster){hero.add(new Option(name,id));const tile=document.createElement('div');tile.className='tile';const img=new Image();img.src=id+'/portrait.png';img.alt=name+' isometric portrait';tile.append(img);const label=document.createElement('small');label.textContent=name+' · '+element;tile.append(label);tile.onclick=()=>{hero.value=id;select();};document.querySelector('#gallery').append(tile);}
for(const name of Object.keys(poses))pose.add(new Option(name[0].toUpperCase()+name.slice(1),name));dirs.forEach((name,i)=>direction.add(new Option(name,String(i))));
function select(){document.querySelector('#reference').src='../'+hero.value+'.png';document.querySelector('#caption').textContent=roster.find(r=>r[0]===hero.value)[1]+' · '+dirs[Number(direction.value)]+' · '+pose.value+' · fixed foot anchor (80, 154)';time=0;frame.value=0;}
function label(){button.textContent=playing?'Pause':'Play';}button.onclick=()=>{playing=!playing;label();};frame.oninput=()=>{playing=false;label();};hero.onchange=pose.onchange=direction.onchange=select;label();select();
function tick(now){if(playing)time+=(now-last)/1000;last=now;const key=hero.value+':'+direction.value;if(!cache[key]){const img=new Image();img.src=hero.value+'/hero_y'+String(Number(direction.value)*45).padStart(3,'0')+'.png';cache[key]=img;}const img=cache[key],spec=poses[pose.value];const local=spec[2]?time:time%(6/spec[1]+.4);const f=playing?Math.min(5,Math.floor(local*spec[1])% (spec[2]?6:1000)):Number(frame.value);if(playing)frame.value=f;const index=spec[0]+f;ctx.clearRect(0,0,320,384);if(img.complete&&img.naturalWidth)ctx.drawImage(img,index%6*160,Math.floor(index/6)*192,160,192,0,0,320,384);requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></html>
