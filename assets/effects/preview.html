<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>House of Cinders · particle library</title>
<style>body{background:#111e23;color:#ede2c9;font:16px system-ui;margin:0 auto;padding:32px;max-width:1100px}h1{color:#efc47b}button{background:#23403e;color:#ffe2a5;border:1px solid #b88c45;padding:10px 20px;cursor:pointer}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin:24px 0}article{background:#182b30;border:1px solid #55706d;text-align:center;padding:12px}canvas{width:192px;height:192px}img{width:100%;max-width:768px}a{color:#efc47b}</style>
<h1>House of Cinders — elemental particles</h1><p>Nine animated geometry renders from Blender. Casts and impacts play the burst once; projectiles and fields repeat it.</p><button id="toggle">Pause animation</button> <label><input id="still" type="checkbox"> Reduced motion</label><main id="grid"></main><h2>Resource and action symbols</h2><img src="../ui/icons.png" alt="24 brass and enamel symbols for health, shield, attack, skill, dodge, ammo, bag, team, shop, reroll, door, help, settings, sound, save, trophy, defeat, check, close, pause, play, back, floor and reaction"><p>Blender source: <code>art-src/blender/element-effects.blend</code> · <a href="README.md">Export and integration notes</a></p>
<script>const names=['Pyro','Hydro','Anemo','Geo','Dendro','Cryo','Electro','Gravity','Antimatter'];let paused=false,t=0,last=0;const entries=names.map(name=>{const article=document.createElement('article'),title=document.createElement('h2'),canvas=document.createElement('canvas');title.textContent=name;canvas.width=canvas.height=192;article.append(title,canvas);grid.append(article);const img=new Image;img.src=name.toLowerCase()+'.png';return{img,ctx:canvas.getContext('2d')}});toggle.onclick=()=>{paused=!paused;toggle.textContent=paused?'Play animation':'Pause animation'};function draw(now){if(!paused)t+=(now-last)/1000;last=now;const frame=still.checked?4:Math.floor(t*20)%12;for(const {img,ctx} of entries){ctx.clearRect(0,0,192,192);if(img.complete&&img.naturalWidth)ctx.drawImage(img,frame%6*192,Math.floor(frame/6)*192,192,192,0,0,192,192)}requestAnimationFrame(draw)}requestAnimationFrame(draw);</script></html>
